<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Physics Dice Roller</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23d97706'/><circle cx='30' cy='30' r='12' fill='%23ffffff'/><circle cx='70' cy='30' r='12' fill='%23ffffff'/><circle cx='50' cy='50' r='12' fill='%23ffffff'/><circle cx='30' cy='70' r='12' fill='%23ffffff'/><circle cx='70' cy='70' r='12' fill='%23ffffff'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #1a0f08;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 20;
            transition: opacity 0.4s ease;
        }

        .hidden {
            display: none !important;
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .selector-btn.active {
            background-color: #d97706 !important;
            border-color: #f59e0b !important;
        }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen" class="screen bg-gradient-to-br from-amber-950/95 to-stone-950/95 backdrop-blur-md p-2 overflow-y-auto">
        <div class="max-w-xs w-full p-4 my-auto rounded-2xl bg-neutral-900/85 border border-amber-600/30 shadow-2xl shadow-amber-950/50">
            <h1 class="text-2xl font-extrabold mb-1 text-amber-400 tracking-tight">3D Dice Roller</h1>
            <p class="text-neutral-300 mb-3 text-xs">Configure your roll mode, color, and dice count.</p>
            
            <!-- Roll Mode Selector -->
            <div class="mb-1 text-[10px] font-semibold uppercase tracking-wider text-neutral-400 text-left">Roll Mode</div>
            <div class="grid grid-cols-2 gap-2 mb-2.5">
                <button id="mode-tap" onclick="setRollMode('tap')" class="selector-btn active py-2 px-1 bg-neutral-800 hover:bg-neutral-700 font-bold text-xs rounded-xl border border-neutral-600 transition-all cursor-pointer">
                    Pop-a-Matic Dome
                </button>
                <button id="mode-table" onclick="setRollMode('table')" class="selector-btn py-2 px-1 bg-neutral-800 hover:bg-neutral-700 font-bold text-xs rounded-xl border border-neutral-600 transition-all cursor-pointer">
                    Classic Table
                </button>
            </div>

            <!-- Dice Color Choice -->
            <div class="mb-1 text-[10px] font-semibold uppercase tracking-wider text-neutral-400 text-left">Dice Color</div>
            <div class="grid grid-cols-3 gap-1.5 mb-2.5">
                <button id="color-ivory" onclick="setDiceColor('ivory')" class="selector-btn active py-2 px-1 bg-neutral-800 hover:bg-neutral-700 font-bold text-[11px] rounded-xl border border-neutral-600 transition-all cursor-pointer">Ivory</button>
                <button id="color-ruby" onclick="setDiceColor('ruby')" class="selector-btn py-2 px-1 bg-neutral-800 hover:bg-neutral-700 font-bold text-[11px] rounded-xl border border-neutral-600 transition-all cursor-pointer">Ruby Red</button>
                <button id="color-onyx" onclick="setDiceColor('onyx')" class="selector-btn py-2 px-1 bg-neutral-800 hover:bg-neutral-700 font-bold text-[11px] rounded-xl border border-neutral-600 transition-all cursor-pointer">Onyx Gold</button>
                <button id="color-sapphire" onclick="setDiceColor('sapphire')" class="selector-btn py-2 px-1 bg-neutral-800 hover:bg-neutral-700 font-bold text-[11px] rounded-xl border border-neutral-600 transition-all cursor-pointer">Sapphire</button>
                <button id="color-emerald" onclick="setDiceColor('emerald')" class="selector-btn py-2 px-1 bg-neutral-800 hover:bg-neutral-700 font-bold text-[11px] rounded-xl border border-neutral-600 transition-all cursor-pointer">Emerald</button>
            </div>

            <!-- Number of Dice Choice -->
            <div class="mb-1 text-[10px] font-semibold uppercase tracking-wider text-neutral-400 text-left">Number of Dice</div>
            <div class="grid grid-cols-5 gap-1.5">
                <button onclick="startApp(1)" class="py-2.5 bg-amber-700 hover:bg-amber-600 active:scale-95 font-bold text-sm rounded-xl shadow-md transition-all border border-amber-500/40 cursor-pointer">1</button>
                <button onclick="startApp(2)" class="py-2.5 bg-amber-700 hover:bg-amber-600 active:scale-95 font-bold text-sm rounded-xl shadow-md transition-all border border-amber-500/40 cursor-pointer">2</button>
                <button onclick="startApp(3)" class="py-2.5 bg-amber-700 hover:bg-amber-600 active:scale-95 font-bold text-sm rounded-xl shadow-md transition-all border border-amber-500/40 cursor-pointer">3</button>
                <button onclick="startApp(4)" class="py-2.5 bg-amber-700 hover:bg-amber-600 active:scale-95 font-bold text-sm rounded-xl shadow-md transition-all border border-amber-500/40 cursor-pointer">4</button>
                <button onclick="startApp(5)" class="py-2.5 bg-amber-700 hover:bg-amber-600 active:scale-95 font-bold text-sm rounded-xl shadow-md transition-all border border-amber-500/40 cursor-pointer">5</button>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen hidden pointer-events-none">
        <!-- HUD Header -->
        <div class="absolute top-4 left-4 right-4 flex justify-between items-center pointer-events-auto z-30">
            <div class="flex gap-2">
                <button onclick="throwDice()" class="bg-amber-700/90 hover:bg-amber-600 border border-amber-500/50 text-white font-semibold px-3.5 py-2 rounded-xl shadow-lg backdrop-blur-md transition-all active:scale-95 text-sm cursor-pointer">Throw</button>
                <button onclick="returnToMenu()" class="bg-neutral-800/80 hover:bg-neutral-700 border border-neutral-600 text-white font-semibold px-3.5 py-2 rounded-xl shadow-lg backdrop-blur-md transition-all active:scale-95 text-sm cursor-pointer">Menu</button>
            </div>
            <div id="result-display" class="bg-neutral-900/85 border border-amber-500/40 px-4 py-2 rounded-xl font-bold text-amber-400 text-sm shadow-xl backdrop-blur-md">
                Rolling...
            </div>
        </div>

        <div id="hint-banner" class="absolute bottom-4 text-neutral-300 text-xs pointer-events-none bg-black/50 px-3 py-1.5 rounded-full backdrop-blur-sm border border-white/10">
            Tap anywhere to roll dice
        </div>
    </div>

    <!-- 3D Canvas -->
    <canvas id="game-canvas"></canvas>

    <script>
        class RoundedBoxGeometry extends THREE.BufferGeometry {
            constructor(width = 1, height = 1, depth = 1, radius = 0.025, smoothness = 2) {
                super();
                this.type = 'RoundedBoxGeometry';

                radius = Math.min(width / 2, height / 2, depth / 2, radius);
                const geom = new THREE.BoxGeometry(width, height, depth, smoothness, smoothness, smoothness);
                const position = geom.attributes.position;

                const hw = width / 2 - radius;
                const hh = height / 2 - radius;
                const hd = depth / 2 - radius;

                const v = new THREE.Vector3();

                for (let i = 0; i < position.count; i++) {
                    v.fromBufferAttribute(position, i);

                    const ox = Math.sign(v.x);
                    const oy = Math.sign(v.y);
                    const oz = Math.sign(v.z);

                    const ax = Math.abs(v.x);
                    const ay = Math.abs(v.y);
                    const az = Math.abs(v.z);

                    if (ax > hw && ay > hh && az > hd) {
                        const cx = ox * hw;
                        const cy = oy * hh;
                        const cz = oz * hd;
                        v.set(cx, cy, cz).add(v.clone().sub(new THREE.Vector3(cx, cy, cz)).normalize().multiplyScalar(radius));
                    } else if (ax > hw && ay > hh) {
                        const cx = ox * hw;
                        const cy = oy * hh;
                        const loc = new THREE.Vector3(cx, cy, v.z);
                        v.copy(loc).add(v.clone().sub(loc).normalize().multiplyScalar(radius));
                    } else if (ax > hw && az > hd) {
                        const cx = ox * hw;
                        const cz = oz * hd;
                        const loc = new THREE.Vector3(cx, v.y, cz);
                        v.copy(loc).add(v.clone().sub(loc).normalize().multiplyScalar(radius));
                    } else if (ay > hh && az > hd) {
                        const cy = oy * hh;
                        const cz = oz * hd;
                        const loc = new THREE.Vector3(v.x, cy, cz);
                        v.copy(loc).add(v.clone().sub(loc).normalize().multiplyScalar(radius));
                    }

                    position.setXYZ(i, v.x, v.y, v.z);
                }

                geom.computeVertexNormals();
                this.copy(geom);
            }
        }
        THREE.RoundedBoxGeometry = RoundedBoxGeometry;

        const splashScreen = document.getElementById('splash-screen');
        const gameScreen = document.getElementById('game-screen');
        const canvas = document.getElementById('game-canvas');
        const resultDisplay = document.getElementById('result-display');
        const hintBanner = document.getElementById('hint-banner');

        let scene, camera, renderer;
        let world;
        let diceObjects = [];
        let diceCount = 2;
        let selectedRollMode = 'tap'; 
        let selectedDiceColor = 'ivory'; 
        let isStoppedCalculated = false;
        let clock = new THREE.Clock();
        let domeGroup = null;
        let domeBodies = [];

        const tableWidth = 8.5;
        const tableHeight = 12;

        function setRollMode(mode) {
            selectedRollMode = mode;
            document.getElementById('mode-tap').classList.toggle('active', mode === 'tap');
            document.getElementById('mode-table').classList.toggle('active', mode === 'table');
        }

        function setDiceColor(color) {
            selectedDiceColor = color;
            ['ivory', 'ruby', 'onyx', 'sapphire', 'emerald'].forEach(c => {
                const btn = document.getElementById(`color-${c}`);
                if (btn) btn.classList.toggle('active', c === color);
            });
        }

        function playClinkClonkSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();

                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(1400, ctx.currentTime);
                osc1.frequency.exponentialRampToValueAtTime(500, ctx.currentTime + 0.06);
                gain1.gain.setValueAtTime(0.35, ctx.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.06);
                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc1.start();
                osc1.stop(ctx.currentTime + 0.06);

                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(360, ctx.currentTime + 0.03);
                osc2.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + 0.18);
                gain2.gain.setValueAtTime(0.45, ctx.currentTime + 0.03);
                gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.18);
                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                osc2.start(ctx.currentTime + 0.03);
                osc2.stop(ctx.currentTime + 0.18);
            } catch(e) {}
        }

        function createWoodTexture() {
            const canvasTex = document.createElement('canvas');
            canvasTex.width = 512;
            canvasTex.height = 512;
            const ctx = canvasTex.getContext('2d');
            
            ctx.fillStyle = '#6b3e1e';
            ctx.fillRect(0, 0, 512, 512);

            ctx.fillStyle = 'rgba(40, 20, 8, 0.25)';
            for (let i = 0; i < 60; i++) {
                const y = Math.random() * 512;
                const h = 5 + Math.random() * 15;
                ctx.fillRect(0, y, 512, h);
            }

            ctx.strokeStyle = 'rgba(30, 15, 5, 0.15)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 30; i++) {
                ctx.beginPath();
                let x = Math.random() * 512;
                ctx.moveTo(x, 0);
                ctx.lineTo(x + (Math.random() - 0.5) * 50, 512);
                ctx.stroke();
            }

            return new THREE.CanvasTexture(canvasTex);
        }

        function setDomeBoundary(enabled) {
            domeBodies.forEach(b => world.remove(b));
            domeBodies = [];

            if (enabled) {
                const numSegments = 8;
                const radius = 3.6;
                const wallHeight = 4;
                const wallMaterial = world.materials[1];

                for (let i = 0; i < numSegments; i++) {
                    const angle1 = (i / numSegments) * Math.PI * 2;
                    const angle2 = ((i + 1) / numSegments) * Math.PI * 2;
                    const x1 = Math.cos(angle1) * radius;
                    const z1 = Math.sin(angle1) * radius;
                    const x2 = Math.cos(angle2) * radius;
                    const z2 = Math.sin(angle2) * radius;

                    const cx = (x1 + x2) / 2;
                    const cz = (z1 + z2) / 2;
                    const length = Math.hypot(x2 - x1, z2 - z1);
                    const rot = Math.atan2(z2 - z1, x2 - x1);

                    const shape = new CANNON.Box(new CANNON.Vec3(length / 2, wallHeight / 2, 0.3));
                    const body = new CANNON.Body({ mass: 0, material: wallMaterial, shape: shape });
                    body.position.set(cx, 2, cz);
                    body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), -rot);
                    world.addBody(body);
                    domeBodies.push(body);
                }
            }
        }

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a0f08);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 13.5, 10.5);
            camera.lookAt(0, -0.5, 0);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffedd5, 0.95);
            dirLight.position.set(2, 18, 6);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            const fillLight = new THREE.DirectionalLight(0x93c5fd, 0.4);
            fillLight.position.set(-8, 10, -4);
            scene.add(fillLight);

            world = new CANNON.World();
            world.gravity.set(0, -32, 0);
            world.broadphase = new CANNON.NaiveBroadphase();
            world.solver.iterations = 12;

            const woodMaterial = new CANNON.Material('wood');
            const wallMaterial = new CANNON.Material('wall');
            const diceMaterial = new CANNON.Material('dice');

            world.addContactMaterial(new CANNON.ContactMaterial(diceMaterial, woodMaterial, { friction: 0.35, restitution: 0.4 }));
            world.addContactMaterial(new CANNON.ContactMaterial(diceMaterial, wallMaterial, { friction: 0.2, restitution: 0.7 }));
            world.addContactMaterial(new CANNON.ContactMaterial(diceMaterial, diceMaterial, { friction: 0.2, restitution: 0.5 }));

            const groundBody = new CANNON.Body({
                mass: 0,
                material: woodMaterial,
                shape: new CANNON.Plane()
            });
            groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            world.addBody(groundBody);

            const woodTex = createWoodTexture();
            woodTex.wrapS = THREE.RepeatWrapping;
            woodTex.wrapT = THREE.RepeatWrapping;
            woodTex.repeat.set(2, 3);

            const tableGeo = new THREE.PlaneGeometry(tableWidth, tableHeight);
            const tableMat = new THREE.MeshStandardMaterial({ 
                map: woodTex, 
                roughness: 0.4, 
                metalness: 0.05 
            });
            const tableMesh = new THREE.Mesh(tableGeo, tableMat);
            tableMesh.rotation.x = -Math.PI / 2;
            tableMesh.receiveShadow = true;
            scene.add(tableMesh);

            const borderGeo = new THREE.BoxGeometry(tableWidth + 0.8, 0.6, tableHeight + 0.8);
            const borderMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.35 });
            const borderMesh = new THREE.Mesh(borderGeo, borderMat);
            borderMesh.position.set(0, -0.3, 0);
            borderMesh.receiveShadow = true;
            borderMesh.castShadow = true;
            scene.add(borderMesh);

            // Pop-a-Matic Dome Group
            domeGroup = new THREE.Group();

            const baseCollarGeo = new THREE.CylinderGeometry(3.9, 4.0, 0.12, 32);
            const baseCollarMat = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.3, metalness: 0.2 });
            const baseCollar = new THREE.Mesh(baseCollarGeo, baseCollarMat);
            baseCollar.position.set(0, 0.06, 0);
            baseCollar.castShadow = true;
            domeGroup.add(baseCollar);

            const domeGeo = new THREE.SphereGeometry(3.8, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
            const domeMat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.42,
                roughness: 0.08,
                metalness: 0.15,
                transmission: 0.65,
                ior: 1.5,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1,
                side: THREE.DoubleSide,
                depthWrite: false
            });
            const domeMesh = new THREE.Mesh(domeGeo, domeMat);
            domeMesh.position.set(0, 0, 0);
            domeGroup.add(domeMesh);

            scene.add(domeGroup);

            const wallHeight = 4;
            function addWall(x, y, z, rotY, sx, sy, sz) {
                const shape = new CANNON.Box(new CANNON.Vec3(sx, sy, sz));
                const body = new CANNON.Body({ mass: 0, material: wallMaterial, shape: shape });
                body.position.set(x, y, z);
                if (rotY) body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), rotY);
                world.addBody(body);
            }
            addWall(0, 2, -tableHeight/2, 0, tableWidth/2, wallHeight, 0.4);
            addWall(0, 2, tableHeight/2, 0, tableWidth/2, wallHeight, 0.4);
            addWall(-tableWidth/2, 2, 0, Math.PI/2, tableHeight/2, wallHeight, 0.4);
            addWall(tableWidth/2, 2, 0, Math.PI/2, tableHeight/2, wallHeight, 0.4);

            window.addEventListener('resize', onWindowResize);
        }

        function createDiceFaceTexture(number, colorTheme) {
            const canvasFace = document.createElement('canvas');
            canvasFace.width = 256;
            canvasFace.height = 256;
            const ctx = canvasFace.getContext('2d');

            let bgGrad1 = '#ffffff', bgGrad2 = '#f1f5f9';
            let pipColor1 = '#020617', pipColor2 = '#334155';
            let borderColor = '#cbd5e1';

            if (colorTheme === 'ruby') {
                bgGrad1 = '#991b1b'; bgGrad2 = '#7f1d1d';
                pipColor1 = '#ffffff'; pipColor2 = '#e2e8f0';
                borderColor = '#b91c1c';
            } else if (colorTheme === 'onyx') {
                bgGrad1 = '#171717'; bgGrad2 = '#0a0a0a';
                pipColor1 = '#fbbf24'; pipColor2 = '#d97706';
                borderColor = '#262626';
            } else if (colorTheme === 'sapphire') {
                bgGrad1 = '#1e3a8a'; bgGrad2 = '#1e293b';
                pipColor1 = '#ffffff'; pipColor2 = '#cbd5e1';
                borderColor = '#1d4ed8';
            } else if (colorTheme === 'emerald') {
                bgGrad1 = '#065f46'; bgGrad2 = '#064e3b';
                pipColor1 = '#ffffff'; pipColor2 = '#cbd5e1';
                borderColor = '#047857';
            }

            const grad = ctx.createLinearGradient(0, 0, 256, 256);
            grad.addColorStop(0, bgGrad1);
            grad.addColorStop(1, bgGrad2);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);

            ctx.strokeStyle = borderColor;
            ctx.lineWidth = 6;
            ctx.strokeRect(3, 3, 250, 250);

            const r = 26;
            const s = 68;
            const c = 128;

            const coords = {
                1: [[c, c]],
                2: [[s, s], [256-s, 256-s]],
                3: [[s, s], [c, c], [256-s, 256-s]],
                4: [[s, s], [256-s, s], [s, 256-s], [256-s, 256-s]],
                5: [[s, s], [256-s, s], [c, c], [s, 256-s], [256-s, 256-s]],
                6: [[s, s], [256-s, s], [s, c], [256-s, c], [s, 256-s], [256-s, 256-s]]
            };

            (coords[number] || []).forEach(pt => {
                ctx.save();
                ctx.translate(pt[0], pt[1]);

                const pipGrad = ctx.createRadialGradient(-4, -4, 2, 0, 0, r);
                pipGrad.addColorStop(0, colorTheme === 'onyx' ? '#fff' : pipColor1);
                pipGrad.addColorStop(0.7, pipColor1);
                pipGrad.addColorStop(1, pipColor2);

                ctx.fillStyle = pipGrad;
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = colorTheme === 'onyx' ? 'rgba(255, 255, 255, 0.4)' : 'rgba(0, 0, 0, 0.3)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(2, 2, r - 3, Math.PI, Math.PI * 1.5);
                ctx.stroke();

                ctx.restore();
            });

            return new THREE.CanvasTexture(canvasFace);
        }

        function createDiceBumpMap(number) {
            const canvasBump = document.createElement('canvas');
            canvasBump.width = 256;
            canvasBump.height = 256;
            const ctx = canvasBump.getContext('2d');

            ctx.fillStyle = '#808080';
            ctx.fillRect(0, 0, 256, 256);

            const r = 26;
            const s = 68;
            const c = 128;

            const coords = {
                1: [[c, c]],
                2: [[s, s], [256-s, 256-s]],
                3: [[s, s], [c, c], [256-s, 256-s]],
                4: [[s, s], [256-s, s], [s, 256-s], [256-s, 256-s]],
                5: [[s, s], [256-s, s], [c, c], [s, 256-s], [256-s, 256-s]],
                6: [[s, s], [256-s, s], [s, c], [256-s, c], [s, 256-s], [256-s, 256-s]]
            };

            (coords[number] || []).forEach(pt => {
                const grad = ctx.createRadialGradient(pt[0], pt[1], 2, pt[0], pt[1], r);
                grad.addColorStop(0, '#000000');
                grad.addColorStop(1, '#808080');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(pt[0], pt[1], r, 0, Math.PI * 2);
                ctx.fill();
            });

            return new THREE.CanvasTexture(canvasBump);
        }

        function spawnDice(count) {
            diceObjects.forEach(d => {
                scene.remove(d.mesh);
                world.remove(d.body);
            });
            diceObjects = [];

            const diceSize = 1.1;
            const cornerRadius = 0.025;
            const smoothness = 2;
            const boxGeometry = new THREE.RoundedBoxGeometry(diceSize, diceSize, diceSize, cornerRadius, smoothness);
            
            const faceOrder = [3, 4, 1, 6, 2, 5];
            const materials = faceOrder.map(num => new THREE.MeshStandardMaterial({
                map: createDiceFaceTexture(num, selectedDiceColor),
                bumpMap: createDiceBumpMap(num),
                bumpScale: 0.04,
                roughness: selectedDiceColor === 'ruby' ? 0.15 : 0.2,
                metalness: selectedDiceColor === 'onyx' ? 0.3 : 0.05,
                clearcoat: 0.3,
                clearcoatRoughness: 0.1
            }));

            const shape = new CANNON.Box(new CANNON.Vec3(diceSize/2, diceSize/2, diceSize/2));
            const diceMaterial = world.materials[2];

            for (let i = 0; i < count; i++) {
                const body = new CANNON.Body({
                    mass: 1,
                    material: diceMaterial,
                    shape: shape,
                    linearDamping: 0.2,
                    angularDamping: 0.2
                });

                body.position.set(0, 0.6, 2.0);
                world.addBody(body);

                const mesh = new THREE.Mesh(boxGeometry, materials);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);

                diceObjects.push({ mesh, body, faceOrder });
            }
        }

        function throwDice() {
            isStoppedCalculated = false;
            resultDisplay.textContent = "Rolling...";

            if (selectedRollMode === 'tap') {
                playClinkClonkSound();
            }

            diceObjects.forEach((d) => {
                const randomX = (Math.random() - 0.5) * 3.0;
                const randomZ = (Math.random() - 0.5) * 3.0;
                const randomY = 1.0 + Math.random() * 1.5;
                d.body.position.set(randomX, randomY, randomZ);
                
                d.body.quaternion.setFromEuler(
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI * 2
                );

                const speedFactor = selectedRollMode === 'tap' ? 9 : 12;
                d.body.velocity.set(
                    (Math.random() - 0.5) * speedFactor,
                    4 + Math.random() * 5,
                    (Math.random() - 0.5) * speedFactor
                );

                d.body.angularVelocity.set(
                    (Math.random() - 0.5) * 45,
                    (Math.random() - 0.5) * 45,
                    (Math.random() - 0.5) * 45
                );

                d.body.sleepState = CANNON.Body.AWAKE;
            });
        }

        function checkDiceSettled() {
            if (isStoppedCalculated) return;

            let allStopped = true;
            let results = [];
            const worldUp = new THREE.Vector3(0, 1, 0);

            const localNormals = [
                new THREE.Vector3( 1,  0,  0),
                new THREE.Vector3(-1,  0,  0),
                new THREE.Vector3( 0,  1,  0),
                new THREE.Vector3( 0, -1,  0),
                new THREE.Vector3( 0,  0,  1),
                new THREE.Vector3( 0,  0, -1)
            ];

            for (let d of diceObjects) {
                const speed = d.body.velocity.length();
                const angSpeed = d.body.angularVelocity.length();
                if (speed > 0.08 || angSpeed > 0.08) {
                    allStopped = false;
                    break;
                }

                let maxDot = -Infinity;
                let bestFaceIndex = 0;
                const quat = new THREE.Quaternion(d.body.quaternion.x, d.body.quaternion.y, d.body.quaternion.z, d.body.quaternion.w);

                for (let i = 0; i < 6; i++) {
                    const worldNormal = localNormals[i].clone().applyQuaternion(quat);
                    const dot = worldNormal.dot(worldUp);
                    if (dot > maxDot) {
                        maxDot = dot;
                        bestFaceIndex = i;
                    }
                }

                results.push(d.faceOrder[bestFaceIndex]);
            }

            if (allStopped && diceObjects.length > 0) {
                isStoppedCalculated = true;
                const sum = results.reduce((a, b) => a + b, 0);
                if (results.length > 1) {
                    resultDisplay.textContent = `Result: ${results.join(', ')} (Total: ${sum})`;
                } else {
                    resultDisplay.textContent = `Result: ${results[0]}`;
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function startApp(count) {
            diceCount = count;
            splashScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');

            if (domeGroup) {
                domeGroup.visible = (selectedRollMode === 'tap');
            }

            setDomeBoundary(selectedRollMode === 'tap');

            hintBanner.textContent = selectedRollMode === 'tap' ? 'Tap screen to pop dome & roll' : 'Tap anywhere to roll dice';
            
            if (!scene) {
                init3D();
            }
            spawnDice(diceCount);
            throwDice();
        }

        function returnToMenu() {
            splashScreen.classList.remove('hidden');
            gameScreen.classList.add('hidden');
            setDomeBoundary(false);
        }

        window.addEventListener('pointerdown', (e) => {
            if (gameScreen.classList.contains('hidden')) return;
            if (e.target.tagName === 'BUTTON') return;
            
            throwDice();
        });

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            if (world) {
                world.step(1/60, delta, 3);
                diceObjects.forEach(d => {
                    d.mesh.position.copy(d.body.position);
                    d.mesh.quaternion.copy(d.body.quaternion);
                });
                checkDiceSettled();
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        init3D();
        animate();
    </script>
</body>
</html>
